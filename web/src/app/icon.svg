<!-- * 파비콘 (브라우저 탭 아이콘). 헤더 로고 LogoMark(src/components/icons.tsx)와 같은 그림이다.
       Next.js App Router는 src/app/icon.svg 파일이 있으면 <link rel="icon">을 자동으로 넣는다.
       ! CSS 변수(var(...))는 파비콘에서 안 먹으므로 globals.scss 토큰 값을 직접 적었다.
       viewBox를 살짝 내려(y 1.5) 새싹~몸통이 정사각형 가운데 오게 했다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1.5 28 28">
  <path d="M14 9c-1.2-3.2-3.9-4.4-6.6-3.8.6 2.8 3.3 4.2 6.6 3.8zM14 9c1.2-3.2 3.9-4.4 6.6-3.8-.6 2.8-3.3 4.2-6.6 3.8z" fill="#6dba4a"/>
  <rect x="2" y="9" width="24" height="18" rx="9" fill="#b8ee3a" stroke="#2d2645" stroke-width="2"/>
  <circle cx="10" cy="17.5" r="1.9" fill="#2d2645"/>
  <circle cx="18" cy="17.5" r="1.9" fill="#2d2645"/>
  <path d="M12.4 21q1.6 1.3 3.2 0" stroke="#2d2645" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
